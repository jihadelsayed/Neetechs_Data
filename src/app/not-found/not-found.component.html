<section class="nt-page nt-not-found" aria-labelledby="not-found-title">
  <div class="nt-container nt-container--narrow">
    <div class="nt-error-state nt-error-state--surface nt-error-state--spacious">
      <span class="nt-error-state__icon" aria-hidden="true">404</span>
      <div class="nt-error-state__body">
        <span class="nt-error-state__eyebrow" i18n>Page not found</span>
        <h1 id="not-found-title" class="nt-error-state__title" i18n>We couldn't find that page</h1>
        <p class="nt-error-state__description" i18n>
          The address may be incorrect, or the page may have moved.
        </p>
      </div>
      <div class="nt-error-state__actions">
        <a class="nt-button nt-button--primary" routerLink="/home" i18n>Go to home</a>
        <button class="nt-button nt-button--secondary" type="button" (click)="goBack()" i18n>Go back</button>
      </div>
    </div>
  </div>
</section>
