<header class="nt-header nt-data-header">
  <div class="nt-container nt-data-header__inner">
    <a class="nt-data-header__brand" routerLink="/home" (click)="closeNavbar()">
      <img class="nt-data-header__logo" src="assets/logo.png" alt="" width="36" height="36" />
      <span class="nt-header__title" i18n>Neetechs Data</span>
    </a>

    <nav
      id="primary-navigation"
      class="nt-data-header__navigation"
      [class.nt-data-header__navigation--open]="menuShow"
      aria-label="Primary navigation"
      i18n-aria-label
    >
      <app-menu (click)="closeNavbar()"></app-menu>
    </nav>

    <div class="nt-header__right">
      <app-login-menu *ngIf="!userExist"></app-login-menu>
      <app-user-notifications-menu *ngIf="userExist"></app-user-notifications-menu>
      <app-user-menu *ngIf="userExist"></app-user-menu>

      <button
        class="nt-icon-button nt-icon-button--ghost nt-data-header__menu-trigger"
        type="button"
        aria-controls="primary-navigation"
        [attr.aria-expanded]="menuShow"
        (click)="toggleNavbar()"
      >
        <span class="nt-sr-only" i18n>{{ menuShow ? 'Close main menu' : 'Open main menu' }}</span>
        <svg class="nt-icon-button__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            *ngIf="!menuShow"
            d="M4 6h16M4 12h16M4 18h16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path
            *ngIf="menuShow"
            d="m6 6 12 12M18 6 6 18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </div>
</header>
