<details class="nt-header-popover">
  <summary
    class="nt-button nt-button--ghost nt-button--sm nt-user-trigger"
    [attr.aria-label]="'Open account menu for ' + displayName"
    i18n-aria-label
  >
    <span class="nt-avatar nt-avatar--sm nt-avatar--brand" aria-hidden="true">
      <img
        *ngIf="userInfo?.picture"
        class="nt-avatar__image"
        [src]="userInfo?.picture"
        alt=""
      />
      <span *ngIf="!userInfo?.picture" class="nt-avatar__fallback">{{ initials }}</span>
    </span>
    <span class="nt-user-trigger__name">{{ displayName }}</span>
    <svg class="nt-button__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="m8 10 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" />
    </svg>
  </summary>

  <div class="nt-header-popover__panel">
  <div class="nt-profile-menu" role="menu">
    <div class="nt-profile-menu__header">
      <span class="nt-avatar nt-avatar--lg nt-avatar--brand" aria-hidden="true">
        <img
          *ngIf="userInfo?.picture"
          class="nt-avatar__image"
          [src]="userInfo?.picture"
          alt=""
        />
        <span *ngIf="!userInfo?.picture" class="nt-avatar__fallback">{{ initials }}</span>
      </span>
      <div class="nt-profile-menu__identity">
        <span class="nt-profile-menu__name">{{ displayName }}</span>
        <span class="nt-profile-menu__email">{{ email }}</span>
      </div>
    </div>

    <div class="nt-profile-menu__body">
      <a class="nt-profile-menu__item" [href]="accountUrl" role="menuitem">
        <svg class="nt-profile-menu__item-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 8a7 7 0 0 0-14 0"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <span class="nt-profile-menu__item-main">
          <span class="nt-profile-menu__item-title" i18n>My account</span>
          <span class="nt-profile-menu__item-description" i18n>Profile, language and appearance</span>
        </span>
      </a>
    </div>

    <div class="nt-profile-menu__footer">
      <button
        class="nt-profile-menu__item nt-profile-menu__item--danger"
        type="button"
        role="menuitem"
        (click)="logout()"
      >
        <svg class="nt-profile-menu__item-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M10 17l5-5-5-5m5 5H3m11-9h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="nt-profile-menu__item-title" i18n>Sign out</span>
      </button>
    </div>
  </div>
  </div>
</details>
