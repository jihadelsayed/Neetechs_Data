<details class="nt-header-popover">
  <summary
    class="nt-icon-button nt-icon-button--ghost"
    aria-label="Open notifications"
    i18n-aria-label
  >
    <svg class="nt-icon-button__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 13h4"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </summary>

  <div class="nt-header-popover__panel">
  <section class="nt-notification-center" aria-labelledby="notification-title">
    <header class="nt-notification-center__header">
      <div class="nt-notification-center__header-main">
        <h2 id="notification-title" class="nt-notification-center__title" i18n>Notifications</h2>
        <p class="nt-notification-center__description" i18n>Updates from your Neetechs services</p>
      </div>
    </header>
    <div class="nt-notification-center__empty">
      <span class="nt-notification-center__empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path
            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </span>
      <h3 class="nt-notification-center__empty-title" i18n>You're all caught up</h3>
      <p class="nt-notification-center__empty-description" i18n>
        New notifications will appear here when they are available.
      </p>
    </div>
  </section>
  </div>
</details>
