<ul class="nt-menu nt-menu--horizontal nt-data-navigation">
  <li *ngFor="let url of menu">
    <a
      class="nt-menu__item"
      [class.nt-menu__item--active]="url.routerLink === currentRoute"
      [attr.aria-current]="url.routerLink === currentRoute ? 'page' : null"
      [routerLink]="[url.routerLink]"
    >
      {{ labelFor(url.title) }}
    </a>
  </li>
</ul>
