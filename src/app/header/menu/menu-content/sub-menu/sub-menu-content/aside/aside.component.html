<div class="nt-data-workspace">
  <aside class="nt-data-workspace__sidebar" aria-label="Content navigation" i18n-aria-label>
    <div class="nt-sidebar__section">
      <h2 class="nt-sidebar__section-label" i18n>In this section</h2>

      <div *ngIf="loading" class="nt-skeleton-stack" role="status" aria-label="Loading navigation" i18n-aria-label>
        <span class="nt-skeleton nt-skeleton--text nt-skeleton--shimmer"></span>
        <span class="nt-skeleton nt-skeleton--text nt-skeleton--shimmer"></span>
      </div>

      <div *ngIf="loadError" class="nt-alert nt-alert--danger nt-alert--compact" role="alert">
        <div class="nt-alert__body">
          <span class="nt-alert__description" i18n>Navigation couldn't be loaded.</span>
        </div>
        <button class="nt-button nt-button--secondary nt-button--sm" type="button" (click)="loadSubMenu()" i18n>
          Retry
        </button>
      </div>

      <nav *ngIf="!loading && !loadError" class="nt-menu" aria-label="Topics" i18n-aria-label>
        <a
          *ngFor="let aside of subMenu"
          class="nt-menu__item"
          [class.nt-menu__item--active]="aside.routerLink === currentRoute"
          [attr.aria-current]="aside.routerLink === currentRoute ? 'page' : null"
          [routerLink]="[aside.routerLink]"
        >
          <span class="nt-menu__item-title">{{ aside.name }}</span>
        </a>
      </nav>
    </div>
  </aside>

  <section class="nt-data-workspace__content">
    <article *ngIf="!currentRoute && introduction" class="nt-panel nt-panel--flat">
      <div class="nt-panel__body nt-stack nt-stack--sm">
        <h2 *ngIf="introduction.name" class="nt-panel__title">{{ introduction.name }}</h2>
        <p *ngIf="introduction.example" class="nt-text-body-sm nt-text-muted">{{ introduction.example }}</p>
        <p *ngIf="introduction.description" class="nt-text-body-md">{{ introduction.description }}</p>
      </div>
    </article>

    <div
      *ngIf="!currentRoute && !loading && !loadError && !introduction"
      class="nt-empty-state nt-empty-state--compact"
    >
      <div class="nt-empty-state__body">
        <h2 class="nt-empty-state__title" i18n>No topic selected</h2>
        <p class="nt-empty-state__description" i18n>Select a topic when content becomes available.</p>
      </div>
    </div>

    <router-outlet *ngIf="currentRoute"></router-outlet>
  </section>
</div>
